include: package:flutter_lints/flutter.yaml

linter:
  rules:
    # --- Formatting "Peace Treaty" Rules ---
    # This is the most important one. It forces the trailing comma,
    # which tells the formatter to keep widgets on separate lines.
    # This prevents one AI from trying to "one-line" your code.
    require_trailing_commas: true 

    # Consistency in strings (prevents ' vs ")
    prefer_single_quotes: true
    
    # Keeps your code "Clean" and predictable for the AI
    prefer_const_constructors: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    
    # Logic & Style consistency
    always_declare_return_types: true
    cancel_subscriptions: true
    close_sinks: true
    directives_ordering: true
    package_api_docs: true
    type_init_formals: true

analyzer:
  # This stops the IDE and AI from lagging on generated files
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/generated/**"

  errors:
    # Treat some warnings as errors so the AI can't ignore them
    todo: ignore
    missing_required_param: error
    missing_return: error